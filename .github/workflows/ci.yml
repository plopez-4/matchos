name: CI
on:
  push:
    branches: [main, develop, feature/match-page-polish]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-worker judging image
        run: docker build -t matchos-judge-check .
      - name: Check production startup through simulated managed ingress
        run: |
          docker run -d --name matchos-check -p 127.0.0.1:8000:8000 \
            -e MATCHOS_ALLOWED_HOSTS=127.0.0.1 \
            -e MATCHOS_ALLOWED_ORIGINS=https://127.0.0.1 \
            -e MATCHOS_PROXY_MODE=azure-container-apps \
            -e CONTAINER_APP_NAME=ci-check \
            -e CONTAINER_APP_ENV_DNS_SUFFIX=test.azurecontainerapps.io \
            matchos-judge-check
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-For: 203.0.113.8' http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-For: 203.0.113.8' http://127.0.0.1:8000/ | grep 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-For: 203.0.113.8' http://127.0.0.1:8000/docs)" = 404
      - name: Container diagnostics
        if: failure()
        run: docker logs matchos-check
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade Python packaging tools
        run: python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
      - run: python -m pip install -c backend/constraints.txt -e "./backend[dev]"
      - run: python -m pytest backend/tests
      - name: Check for committed credentials
        run: python scripts/check_secrets.py
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - name: Check shared formatting
        run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frontend bundle for credentials
        run: python scripts/check_secrets.py
