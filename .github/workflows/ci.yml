name: CI
on:
  push:
    branches: [main, develop, feature/match-page-polish]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -c backend/constraints.txt -e "./backend[dev]"
      - run: python -m pytest backend/tests
      - name: Check for committed credentials
        run: python scripts/check_secrets.py
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - name: Check shared formatting
        run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frontend bundle for credentials
        run: python scripts/check_secrets.py
